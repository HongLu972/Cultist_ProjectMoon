plugins {
  id 'java'
  id 'application'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

configurations {
  natives
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
  mainClass = 'com.six.game.lwjgl3.Lwjgl3Launcher'
}

run {
  workingDir = rootProject.file('assets')
  setIgnoreExitValue(true)
}

// 收集依赖
tasks.register('copyDependencies', Copy) {
  dependsOn 'jar'
  from configurations.runtimeClasspath
  from jar.archiveFile
  into layout.buildDirectory.dir('jpackage-input')
}

def safeVersion = project.version.toString().replaceAll("[^0-9.]", "")
if (safeVersion.isEmpty() || safeVersion.equals(".")) safeVersion = "1.0.0"

def iconFile = rootProject.file('assets/img/icons/araya.ico')
def iconPath = iconFile.exists() ? iconFile.absolutePath : ""

def mainJarName = tasks.jar.archiveFile.get().asFile.name
def currentJdkPath = System.getProperty('java.home')
def inputDir = layout.buildDirectory.dir('jpackage-input').get().asFile.absolutePath

// ==========================================
// 任务 1：生成纯净版
// ==========================================
tasks.register('makePureExe', Exec) {
  dependsOn 'jar', 'copyDependencies'
  def outputDir = layout.buildDirectory.dir('jpackage-pure-output').get().asFile.absolutePath

  doFirst {
    delete layout.buildDirectory.dir('jpackage-pure-output')
    println "========================================="
    println "Packaging Base EXE (Pure)..."
    println "========================================="
  }

  def cmdArgs = [
    '--type', 'app-image',
    '--name', 'Cultist_ProjectMoon',
    '--app-version', safeVersion,
    '--input', inputDir,
    '--main-jar', mainJarName,
    '--main-class', 'com.six.game.lwjgl3.Lwjgl3Launcher',
    '--dest', outputDir,
    '--add-modules', 'java.base,java.desktop,jdk.unsupported,java.logging'
  ]
  if (iconPath) cmdArgs.addAll(['--icon', iconPath])
  commandLine = ["${currentJdkPath}/bin/jpackage"] + cmdArgs
}

// ==========================================
// 任务 2：生成测试版（带控制台）
// ==========================================
tasks.register('makeTestExe', Exec) {
  dependsOn 'jar', 'copyDependencies'
  def outputDir = layout.buildDirectory.dir('jpackage-test-output').get().asFile.absolutePath

  doFirst {
    delete layout.buildDirectory.dir('jpackage-test-output')
    println "========================================="
    println "Packaging Test EXE (With CMD)..."
    println "========================================="
  }

  def cmdArgs = [
    '--type', 'app-image',
    '--name', 'Cultist_ProjectMoon_Test',
    '--app-version', safeVersion,
    '--input', inputDir,
    '--main-jar', mainJarName,
    '--main-class', 'com.six.game.lwjgl3.Lwjgl3Launcher',
    '--dest', outputDir,
    '--add-modules', 'java.base,java.desktop,jdk.unsupported,java.logging',
    '--win-console'
  ]
  if (iconPath) cmdArgs.addAll(['--icon', iconPath])
  commandLine = ["${currentJdkPath}/bin/jpackage"] + cmdArgs
}

// ==========================================
// 任务 3：完美合体，生成最终文件夹
// ==========================================
tasks.register('makeBothExe') {
  dependsOn 'makePureExe', 'makeTestExe'

  doLast {
    def pureDir = layout.buildDirectory.dir('jpackage-pure-output/Cultist_ProjectMoon').get().asFile
    def testDir = layout.buildDirectory.dir('jpackage-test-output/Cultist_ProjectMoon_Test').get().asFile
    def finalDir = layout.buildDirectory.dir('jpackage-output').get().asFile

    println "========================================="
    println "Merging EXEs and generating mods..."

    // 1. 清理并创建最终的根目录
    if (finalDir.exists()) finalDir.deleteDir()
    finalDir.mkdirs()

    // 2. 将纯净版的所有内容（app, runtime, 纯exe）移动到最终目录
    if (pureDir.exists()) {
      java.nio.file.Files.move(new File(pureDir, "app").toPath(), new File(finalDir, "app").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      java.nio.file.Files.move(new File(pureDir, "runtime").toPath(), new File(finalDir, "runtime").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      java.nio.file.Files.move(new File(pureDir, "Cultist_ProjectMoon.exe").toPath(), new File(finalDir, "Cultist_ProjectMoon.exe").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }

    // 3. 将测试版的 exe 和 cfg 移动到最终目录（共用同一个 app 和 runtime）
    if (testDir.exists()) {
      java.nio.file.Files.move(new File(testDir, "Cultist_ProjectMoon_Test.exe").toPath(), new File(finalDir, "Cultist_ProjectMoon_Test.exe").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      java.nio.file.Files.move(new File(testDir, "app/Cultist_ProjectMoon_Test.cfg").toPath(), new File(finalDir, "app/Cultist_ProjectMoon_Test.cfg").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }

    // 4. 清理旧文件夹
    if (pureDir.exists()) pureDir.deleteDir()
    if (testDir.exists()) testDir.deleteDir()
    layout.buildDirectory.dir('jpackage-pure-output').get().asFile.deleteDir()
    layout.buildDirectory.dir('jpackage-test-output').get().asFile.deleteDir()

    // 5. 在最终目录生成 Origin 模组
    def originModDir = new File(finalDir, 'mods/Origin')
    if (originModDir.exists()) originModDir.deleteDir()
    originModDir.mkdirs()

    copy {
      from rootProject.file('assets/data')
      into originModDir
      include '**/*.json'
      exclude '**/save*.json'
      exclude '**/slot_*.json'
    }
    copy { from rootProject.file('assets/img'); into new File(originModDir, 'img') }
    copy { from rootProject.file('assets/audio'); into new File(originModDir, 'audio') }
    copy { from rootProject.file('assets/font'); into new File(finalDir, 'font') }

    // 6. 在最终目录生成 Bat 启动器
    def batNames = [
      ["Cultist_ProjectMoon_启动器.bat", "Cultist_ProjectMoon.exe"],
      ["Cultist_ProjectMoon_Test_启动器.bat", "Cultist_ProjectMoon_Test.exe"]
    ]
    batNames.each { batInfo ->
      def batFile = new File(finalDir, batInfo[0])
      def batContent = "@echo off\r\ncd /d \"%~dp0\"\r\n\"%~dp0${batInfo[1]}\"\r\nif %errorlevel% neq 0 pause"
      batFile.write(batContent, 'UTF-8')
    }

    println "========================================="
    println "All EXEs successfully merged into:"
    println "lwjgl3/build/jpackage-output"
    println "========================================="
  }
}
